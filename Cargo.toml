[workspace]
resolver = "2"
members = ["crates/rmda-core", "crates/rmda-cli", "crates/rmda-py"]
# A plain `cargo build` makes the `rmda` binary without needing Python;
# the bindings build with `-p rmda-py` (or `--workspace`).
default-members = ["crates/rmda-core", "crates/rmda-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.72"
license = "MIT OR Apache-2.0"
authors = ["Aslak Fellman <aslak.fellman@helsinki.fi>"]
keywords = ["molecular-dynamics", "materials", "defects", "crystallography", "simulation"]
categories = ["science", "command-line-utilities"]
repository = "https://github.com/fellmana/Rust-MD-Analysis"
homepage = "https://github.com/fellmana/Rust-MD-Analysis"

[workspace.dependencies]
rayon = "1.8"
clap = { version = "=4.4.18", features = ["derive"] }
# 0.25 is the newest pyo3 whose MSRV (1.63) fits rust-version 1.72; 0.26 needs 1.74.
# Cargo.lock pins matrixmultiply 0.3.9 and rustc-hash 2.0.0 (newer need 1.75+/1.77+).
pyo3 = "0.25"
numpy = "0.25"
memmap2 = "0.9"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# `cargo test` builds the dev profile, and the integration tests run the CLI on
# blocks of 10^4-10^5 atoms: unoptimised, the core takes many minutes on them.
# Optimise the numeric core and the dependencies even in dev builds; debug
# assertions and overflow checks stay on, so the tests check as much as before.
[profile.dev.package.rmda-core]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
