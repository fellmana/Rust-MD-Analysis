name: CI

on:
  push:
  pull_request:
  # The expensive validation (`slow`, below) runs weekly and by hand.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.72.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.72.0"
          components: clippy
      # pyo3 0.25 builds for Python 3.7-3.14; 3.12 keeps the run reproducible.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Clippy, warnings denied across every crate and target
        run: cargo clippy --workspace --all-targets -- -D warnings
        
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.72.0"
       # pyo3 0.25 builds for Python 3.7-3.14; 3.12 keeps the run reproducible.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The bindings return numpy arrays, so the python_bindings tests need it;
      # ASE and the (free) ovito module let the interop tests run, not skip.
      - run: python -m pip install numpy ase ovito
      - uses: Swatinem/rust-cache@v2
      # The Python bindings live in rmda-py as a cdylib; the rmda-cli
      # python_bindings tests skip unless the module is built and newer than
      # the bindings source, so build it explicitly before testing.
      - name: Build the Python extension module
        run: cargo build -p rmda-py --locked
      - name: Run the workspace test suite (the fast one; expensive tests are #[ignore]d)
        run: cargo test --workspace --locked

  # The expensive validation: synthetic ground-truth blocks of 10^5-10^6 atoms
  # and the other `#[ignore]`d tests, in a release build. The oracles that need
  # research data (RMDA_REFERENCE_DIR, RMDA_CASCADE_DIR) skip here with a line
  # each. About an hour on a hosted runner.
  slow:
    name: slow (release, --include-ignored)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.72.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy ase ovito
      - uses: Swatinem/rust-cache@v2
      - name: Build the Python extension module
        run: cargo build --release -p rmda-py --locked
      - name: Run every test, the ignored ones included
        run: cargo test --workspace --release --locked -- --include-ignored
